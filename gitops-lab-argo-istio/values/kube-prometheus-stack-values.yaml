# Valores do kube-prometheus-stack (Prometheus Operator + Prometheus + Grafana
# + Alertmanager + node-exporter + kube-state-metrics).
#
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm repo update
#   kubectl create namespace observability --dry-run=client -o yaml | kubectl apply -f -
#   kubectl -n observability create secret generic grafana-admin \
#     --from-literal=admin-user=admin \
#     --from-literal=admin-password="$GRAFANA_ADMIN_PASSWORD" \
#     --dry-run=client -o yaml | kubectl apply -f -
#   helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#     -n observability --values values/kube-prometheus-stack-values.yaml

grafana:
  enabled: true
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
  additionalDataSources:
    - name: Tempo
      type: tempo
      access: proxy
      url: http://tempo.observability.svc.cluster.local:3200
      uid: tempo
      jsonData:
        tracesToMetrics:
          datasourceUid: prometheus
        serviceMap:
          datasourceUid: prometheus
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

prometheus:
  prometheusSpec:
    retention: 15d
    scrapeInterval: 30s
    evaluationInterval: 30s
    # Seleciona ServiceMonitors/PodMonitors/PrometheusRules de qualquer namespace,
    # não apenas os criados pelo chart.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 2Gi
    storageSpec:
      emptyDir: {}
  service:
    type: ClusterIP

alertmanager:
  enabled: true
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: "null"
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
    receivers:
      - name: "null"

# Pushgateway recebe a métrica de lead time publicada pelo GitHub Actions.
prometheus-pushgateway:
  enabled: true
  serviceMonitor:
    enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# Métricas de control-plane não existem em clusters gerenciados (EKS/GKE/AKS).
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

nodeExporter:
  enabled: true
kubeStateMetrics:
  enabled: true
