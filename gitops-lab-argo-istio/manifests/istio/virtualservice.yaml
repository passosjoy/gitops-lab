apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: app-virtualservice
  namespace: gitops-lab
  labels:
    app: oficina-lanternagem
    env: lab
    owner: devops
spec:
  hosts:
    - minha-app.local
  gateways:
    - mesh
  http:
    - name: primary
      route:
        - destination:
            host: app-canary-service-stable
          weight: 100
        - destination:
            host: app-canary-service-canary
          weight: 0
