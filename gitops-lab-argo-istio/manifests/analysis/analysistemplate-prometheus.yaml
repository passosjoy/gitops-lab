apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: app-success-rate
  namespace: gitops-lab
spec:
  args:
    - name: service-name
      value: oficina-lanternagem-do-rasta
  metrics:
    - name: success-rate
      interval: 1m
      count: 5
      failureLimit: 1
      successCondition: result[0] >= 0.99
      provider:
        prometheus:
          address: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
          query: |
            sum(rate(oficina_http_requests_good_total{service="{{args.service-name}}"}[2m]))
            /
            clamp_min(
              sum(rate(oficina_http_requests_total{service="{{args.service-name}}"}[2m])),
              0.0001
            )
    - name: p95-latency-ms
      interval: 1m
      count: 5
      failureLimit: 1
      successCondition: result[0] < 500
      provider:
        prometheus:
          address: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
          query: |
            histogram_quantile(
              0.95,
              sum(rate(
                oficina_http_request_duration_milliseconds_bucket{
                  service="{{args.service-name}}"
                }[2m]
              )) by (le)
            )
