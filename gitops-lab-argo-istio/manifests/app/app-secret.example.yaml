# Copie para app-secret.yaml, ajuste os valores e aplique manualmente.
# NÃO commite app-secret.yaml com credenciais reais.
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: gitops-lab
  labels:
    app: oficina-lanternagem
    env: lab
    owner: devops
type: Opaque
stringData:
  DB_NAME: "oficina"
  DB_USER: "oficina"
  DB_PASSWORD: "troque-esta-senha-lab"
  FLASK_SECRET_KEY: "troque-esta-chave-flask-lab"
  DATABASE_URL: "postgresql+psycopg://oficina:troque-esta-senha-lab@postgres.gitops-lab.svc.cluster.local:5432/oficina"
