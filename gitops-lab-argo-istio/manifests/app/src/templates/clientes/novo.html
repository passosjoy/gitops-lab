{% extends "base.html" %}
{% block content %}
<h2 class="mb-4"><i class="bi bi-person-plus"></i> Novo Cliente</h2>
<div class="card shadow-sm">
    <div class="card-body">
        <form method="POST">
            <div class="row g-3">
                <div class="col-md-6"><label class="form-label">Nome *</label><input type="text" name="nome" class="form-control" required></div>
                <div class="col-md-6"><label class="form-label">Telefone</label><input type="text" name="telefone" class="form-control"></div>
                <div class="col-md-6"><label class="form-label">CPF/CNPJ</label><input type="text" name="cpf_cnpj" class="form-control"></div>
                <div class="col-md-6"><label class="form-label">Endereço</label><input type="text" name="endereco" class="form-control"></div>
            </div>
            <button class="btn btn-dark mt-3"><i class="bi bi-check-circle"></i> Cadastrar</button>
            <a href="/clientes" class="btn btn-secondary mt-3">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
