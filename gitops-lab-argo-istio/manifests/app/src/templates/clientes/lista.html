{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="bi bi-people"></i> Clientes</h2>
    <a href="/clientes/novo" class="btn btn-dark"><i class="bi bi-person-plus"></i> Novo Cliente</a>
</div>
<table class="table table-striped bg-white shadow-sm">
    <thead class="table-dark">
        <tr><th>Nome</th><th>Telefone</th><th>CPF/CNPJ</th><th>Endereço</th><th>Cadastrado em</th></tr>
    </thead>
    <tbody>
        {% for c in clientes %}
        <tr>
            <td>{{ c.nome }}</td>
            <td>{{ c.telefone }}</td>
            <td>{{ c.cpf_cnpj }}</td>
            <td>{{ c.endereco }}</td>
            <td>{{ c.created_at.strftime('%d/%m/%Y') if c.created_at }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
