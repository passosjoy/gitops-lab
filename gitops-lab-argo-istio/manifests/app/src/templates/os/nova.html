{% extends "base.html" %}
{% block content %}
<h2 class="mb-4"><i class="bi bi-plus-circle"></i> Abrir Ordem de Serviço</h2>
<div class="card shadow-sm">
    <div class="card-body">
        <form method="POST">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Cliente *</label>
                    <select name="cliente_id" class="form-select" required>
                        <option value="">Selecione...</option>
                        {% for c in clientes %}
                        <option value="{{ c.id }}">{{ c.nome }} - {{ c.telefone }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6"><label class="form-label">Responsável</label><input type="text" name="responsavel" class="form-control"></div>
                <div class="col-md-4"><label class="form-label">Marca</label><input type="text" name="veiculo_marca" class="form-control"></div>
                <div class="col-md-4"><label class="form-label">Modelo</label><input type="text" name="veiculo_modelo" class="form-control"></div>
                <div class="col-md-4"><label class="form-label">Placa</label><input type="text" name="placa" class="form-control"></div>
                <div class="col-md-4"><label class="form-label">KM</label><input type="number" name="km" class="form-control"></div>
                <div class="col-md-8"><label class="form-label">Sintoma / Defeito</label><input type="text" name="sintoma" class="form-control"></div>
            </div>
            <button class="btn btn-dark mt-3"><i class="bi bi-check-circle"></i> Abrir OS</button>
            <a href="/os" class="btn btn-secondary mt-3">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
