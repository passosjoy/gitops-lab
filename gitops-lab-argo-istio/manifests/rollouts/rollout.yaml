apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: app-canary-service
  namespace: gitops-lab
  labels:
    app: oficina-lanternagem
    env: lab
    owner: devops
  annotations:
    notifications.argoproj.io/subscribe.on-rollout-completed-slack.slack: sre-rollouts
    notifications.argoproj.io/subscribe.on-rollout-aborted-slack.slack: sre-rollouts
    notifications.argoproj.io/subscribe.on-rollout-completed-github.github: dora
    notifications.argoproj.io/subscribe.on-rollout-aborted-github.github: dora
    # Preenchido pelo pipeline de deploy para cálculo de Lead Time (DORA).
    # github-sha: "0000000000000000000000000000000000000000"
spec:
  replicas: 2
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 600
  selector:
    matchLabels:
      app: oficina-lanternagem
  template:
    metadata:
      labels:
        app: oficina-lanternagem
        env: lab
        owner: devops
      annotations:
        sidecar.istio.io/inject: "true"
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: web
          # Substituído pelo pipeline (build-and-push + bump GitOps/deploy). NÃO use :latest (policy-check bloqueia).
          image: ghcr.io/SEU-USUARIO/SEU-REPO/app:initial
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
          env:
            - name: APP_VERSION
              value: "latest"
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
  strategy:
    canary:
      canaryService: app-canary-service-canary
      stableService: app-canary-service-stable
      trafficRouting:
        istio:
          virtualService:
            name: app-virtualservice
            routes:
              - primary
      analysis:
        templates:
          - templateName: app-success-rate
        startingStep: 1
        args:
          - name: service-name
            value: oficina-lanternagem-do-rasta
      steps:
        - setWeight: 10
        - pause:
            duration: 2m
        - setWeight: 50
        - pause:
            duration: 2m
        - setWeight: 100
