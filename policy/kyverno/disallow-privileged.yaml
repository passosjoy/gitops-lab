apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-privileged-containers
  annotations:
    policies.kyverno.io/title: Disallow privileged containers
    policies.kyverno.io/severity: high
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: privileged-false
      match:
        any:
          - resources:
              apiGroups:
                - argoproj.io
              kinds:
                - Rollout
              namespaces:
                - gitops-lab
      validate:
        message: "securityContext.privileged=true não é permitido."
        pattern:
          spec:
            template:
              spec:
                containers:
                  - securityContext:
                      privileged: "!true"
