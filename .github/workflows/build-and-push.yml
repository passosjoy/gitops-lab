name: "02 - Build and Push (GHCR)"

on:
  workflow_call:
    inputs:
      push_image:
        type: boolean
        required: false
        default: true
    outputs:
      image_tag:
        description: "Tag/SHA da imagem"
        value: ${{ jobs.build-push.outputs.image_tag }}
      image:
        description: "Imagem completa"
        value: ${{ jobs.build-push.outputs.image }}
  push:
    branches: [main]
    paths:
      - "gitops-lab-argo-istio/manifests/app/src/**"
      - ".github/workflows/build-and-push.yml"
      - ".github/workflows/ci-cd.yml"
  pull_request:
    paths:
      - "gitops-lab-argo-istio/manifests/app/src/**"
  workflow_dispatch:
    inputs:
      push_image:
        description: "Fazer push da imagem"
        type: boolean
        required: false
        default: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/app

jobs:
  build-push:
    name: Build and push container image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.out.outputs.tag }}
      image: ${{ steps.out.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && (inputs.push_image != false)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long,prefix=
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=pr

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./gitops-lab-argo-istio/manifests/app/src
          file: ./gitops-lab-argo-istio/manifests/app/src/Dockerfile
          push: ${{ github.event_name != 'pull_request' && (inputs.push_image != false) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Outputs
        id: out
        shell: bash
        run: |
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          echo "### 02 - Build/Push" >> "$GITHUB_STEP_SUMMARY"
          echo "- Imagem: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Push: \`${{ github.event_name != 'pull_request' && (inputs.push_image != false) }}\`" >> "$GITHUB_STEP_SUMMARY"
