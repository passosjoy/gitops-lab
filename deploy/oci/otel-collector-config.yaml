receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  debug:
    verbosity: basic
  # Para enviar traces ao Tempo no k3s/stack completa, ajuste o endpoint.
  # otlp/tempo:
  #   endpoint: tempo.observability.svc.cluster.local:4317
  #   tls:
  #     insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
